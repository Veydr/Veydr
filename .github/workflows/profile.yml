name: Refresh public profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: write

concurrency:
  group: public-profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Refresh cards from public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh-profile.py
      - name: Commit changed cards only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/recent-activity.svg
          if git diff --cached --quiet; then
            echo 'Public metrics are unchanged.'
            exit 0
          fi
          git commit -m 'Refresh public GitHub profile cards [skip ci]'
          git push
